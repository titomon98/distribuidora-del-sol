# Nginx — Distribuidora del Sol (un solo origen: frontend + API + WebSocket)
# Copiar a /etc/nginx/sites-available/distribuidora y enlazar en sites-enabled.
# Certbot editará este archivo al agregar HTTPS (443) automáticamente.

server {
    listen 80;
    listen [::]:80;

    # Pon aquí tu hostname gratis (sslip.io / nip.io / duckdns) o "_" para cualquier host.
    # Ej: server_name 203-0-113-45.sslip.io;
    server_name _;

    # Carpeta con el build de React (subido desde local).
    root /var/www/distribuidora;
    index index.html;

    client_max_body_size 10m;

    # --- API NestJS (prefijo global /api) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket en tiempo real (Socket.IO cobro <-> despacho) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- SPA de React (rutas del cliente caen en index.html) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
